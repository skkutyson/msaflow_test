# MSAFlow SFM Decoder — α-Flow variant, α = 0.5 (unit L⁴ sphere).
# Identical to decoder.yaml except for the geometry block below.
# Reference: Cheng et al., "α-Flow", arXiv:2504.10283.

model:
  vocab_size: 22          # 20 AA + gap + X
  msa_dim: 128            # AF3 compressed MSA embedding dim
  hidden_size: 768        # DiT hidden dim
  depth: 12               # Number of transformer blocks
  num_heads: 12           # Attention heads
  mlp_ratio: 4.0
  max_seq_len: 1024
  alpha: 0.5              # α-geometry: p = 2/(1-α) = 4 → x = µ^(1/4) on the unit L⁴ sphere.
                         # α defaults to 0.0 (L² sphere = SFM) when omitted.

data:
  store_path: /gpfs/deepfold/users/yjlee4/msaflow_merged
  val_store_path: /gpfs/deepfold/users/yjlee4/msaflow_fold
  n_seqs_per_msa: 32
  max_seq_len: 1024
  batch_size: 1           # DDP/autocast fix restores bf16 → can try raising to 4
  num_workers: 4

training:
  epochs: 21
  lr: 1.0e-5
  weight_decay: 0.1
  warmup_steps: 700
  max_grad_norm: 1.0
  grad_accumulation: 4
  seed: 42
  output_dir: /gpfs/deepfold/users/yjlee4/decoder_alpha05
  resume: false
  log_every: 100
  ema_decay: 0.998
  use_ema: true
  mixed_precision: "bf16"
  use_wandb: true
  wandb_project: msaflow
  wandb_run_name: decoder_alpha05
  val_every: 1
  val_proteins: 1000
  val_ode_steps: 100
  val_example_proteins: 3
  val_example_seqs: 5
  t_max_eps: 0.01
