# MSAFlow Latent FM — foldbench LMDB 학습 설정
#
# 데이터셋 규모: ~2760 entries (monomer_protein.csv 334개 + EXTRA 2426개)
# 하드웨어:      ada-004  RTX6000 ×4
#
# 스텝 예산 계산:
#   per-GPU batch = 4, 4 GPU DDP → 각 GPU 2760/4 = 690 샘플/epoch → 172 steps/epoch
#   grad_accumulation = 2  →  effective batch = 4×4×2 = 32
#   100 epochs × 172 steps = 17,200 total optimizer steps
#   warmup 500 steps ≈ 첫 3 epoch

model:
  msa_dim: 128
  esm_dim: 1280
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  max_seq_len: 1024

data:
  store_path: /gpfs/deepfold/users/yjlee4/msaflow_fold
  max_seq_len: 1024
  batch_size: 4           # per-GPU; effective batch = 4×4 GPUs×2 accum = 32
  num_workers: 4

training:
  epochs: 100
  lr: 2.6e-4
  weight_decay: 0.1
  warmup_steps: 500
  max_grad_norm: 1.0
  grad_accumulation: 2
  seed: 42
  output_dir: /runs/latent_fm_foldbench
  resume: true
  log_every: 50
  ema_decay: 0.9999
  use_ema: true
  mixed_precision: "bf16"
  use_wandb: true
  wandb_project: msaflow
  wandb_run_name: latent_fm_foldbench_d12_h768
