[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msaflow"
version = "0.1.0"
description = "MSA generation via flow matching in latent space"
# >=3.12: colabfold[alphafold3] -> flax 0.12.9 needs jax>=0.11.1, whose
# cuda13 wheels are Python 3.12+ only. 3.11 cannot run the af3 stack.
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7",
    "numpy>=1.24",
    "accelerate>=0.30",
    "omegaconf>=2.3",
    "pyarrow>=14",
    "wandb>=0.17",
    "tqdm>=4.66",
    "protenix",
    "fair-esm",
    # pytorch-cu128 whl does not declare nvidia-* as deps.
    # Explicitly install CUDA 12.8 runtime packages so that
    # torch.cuda.is_available() works inside Apptainer (Blackwell/sm_120).
    "nvidia-cuda-runtime-cu12>=12.8,<13",
    "nvidia-cublas-cu12>=12.8,<13",
    "nvidia-cuda-nvrtc-cu12>=12.8,<13",
    "nvidia-nvjitlink-cu12>=12.8,<13",
    "nvidia-nccl-cu12>=2.21,<3",
    "colabfold[alphafold3]",
    # Pin to 0.11.1: flax 0.12.9 (pulled via colabfold[alphafold3]) requires
    # jax>=0.11.1 but uses jax.experimental.hijax.HiPrimitive, which jax 0.11.2
    # removed -> AttributeError on `import flax.nnx`. 0.11.1 still has it.
    "jax[cuda13]>=0.11.1,<0.11.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.uv.sources]
# Relative to this pyproject.toml so it resolves both inside the container
# (cwd /mnt/MSA_FLOW) and on native clones (repo root anywhere).
protenix = { path = "Protenix", editable = true }
fair-esm = { path = "esm" }
torch = { index = "pytorch-cu128" }
colabfold = { git = "https://github.com/sokrypton/ColabFold", rev = "af3-preview" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
override-dependencies = [
    "fair-esm @ file:///mnt/MSA_FLOW/esm", "rdkit==2025.9.4"
    # torch 2.7.1+cu128 (CUDA 12.8) supports Blackwell sm_120 and satisfies
    # protenix==1.1.0's torch==2.7.1 pin without any version override.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["msaflow*"]

[tool.black]
line-length = 99
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
